<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#2A2B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ava's Desk">
<title>Ava's Desk Party</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: sticky desk preview on the left (top on narrow screens), paint-chip control column on the right. Paper-white studio with Ava's blue as the only accent. */
:root{
  --bg:#eef1f6; --panel:#ffffff; --ink:#1d2330; --muted:#5d6779; --line:#d6dce6; --accent:#2c66d6; --accent-ink:#ffffff; --soft:#e3eaf8; --danger:#b3261e;
  --display:'Fredoka','Avenir Next Rounded','Nunito',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11151c;--panel:#1a1f29;--ink:#eef1f6;--muted:#9aa4b6;--line:#2c3443;--accent:#6e9bff;--accent-ink:#0d1320;--soft:#1f2a40;--danger:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151c;--panel:#1a1f29;--ink:#eef1f6;--muted:#9aa4b6;--line:#2c3443;--accent:#6e9bff;--accent-ink:#0d1320;--soft:#1f2a40;--danger:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:1.55rem;letter-spacing:.005em}
h2{font-size:1.08rem}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(320px,1fr);gap:20px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px;min-width:0}
.stage-head{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.now{display:grid;gap:2px;min-width:0}
.now small{color:var(--muted);font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700}
.now strong{font-family:var(--display);font-weight:500;font-size:1.05rem}
.now em{font-style:normal;color:var(--accent);font-weight:700;font-size:.9rem}
.view{position:relative;width:100%;max-width:calc(46vh * 1.7);margin:0 auto}
@media (max-width:900px){.view{max-width:calc(36vh * 1.7)}}
.view canvas{display:block;width:100%;height:auto;border-radius:10px;touch-action:manipulation}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#flash.on{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){#flash.on{animation:none}}
.hint{color:var(--muted);font-size:.85rem;margin:0;text-align:center}
.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:700;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 12px;min-height:34px;font-size:.88rem}
.btn.danger{color:var(--danger);border-color:currentColor}
.controls{display:grid;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.card-head p{margin:0;color:var(--muted);font-size:.86rem}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.preset{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:5px 5px 7px;display:grid;gap:5px;align-content:start;text-align:left;font-weight:600;font-size:.8rem;line-height:1.2}
.preset canvas{width:100%;height:auto;aspect-ratio:1600/941;border-radius:7px;background:var(--line);display:block}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.preset span{padding-inline:2px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 4px;display:grid;justify-items:center;gap:4px;font-weight:700;font-size:.82rem}
.seg button svg{width:34px;height:22px;display:block}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:7.5em minmax(0,1fr);align-items:center;gap:10px}
.opt>label,.opt>span{font-weight:600;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.85rem;min-height:36px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:var(--track,var(--line));border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:10px;border-radius:6px;background:var(--track,var(--line));border:1px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--panel);border:3px solid var(--ink);margin-top:-9px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--panel);border:3px solid var(--ink)}
/* color editor */
.editor{border:1.5px solid var(--accent);border-radius:14px;padding:14px;display:grid;gap:12px;background:var(--bg)}
.ed-head{display:flex;gap:12px;align-items:center}
.sw-big{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);flex:none}
.ed-head h3{font-size:1.1rem}
.code{font-family:var(--mono);font-size:.85rem;color:var(--muted);margin:2px 0 0;font-variant-numeric:tabular-nums}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ed-row label{font-weight:600;font-size:.9rem}
.hex{font-family:var(--mono);font-size:1rem;width:8.5ch;text-transform:uppercase;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:7px 9px}
.hex.bad{border-color:var(--danger)}
.wheel{position:relative;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:.88rem;min-height:40px;cursor:pointer}
.wheel i{width:26px;height:26px;border-radius:50%;background:conic-gradient(#e53935,#fdd835,#43a047,#00acc1,#1e88e5,#8e24aa,#e53935);display:block}
.wheel input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.rgb{display:grid;gap:6px}
.rgb .ch{display:grid;grid-template-columns:1.4em minmax(0,1fr) 4.2em;gap:10px;align-items:center}
.rgb .ch b{font-family:var(--mono);font-size:.95rem}
.rgb input[type=number]{font-family:var(--mono);width:100%;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:6px 6px;text-align:center;font-variant-numeric:tabular-nums}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.quick button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);padding:0}
.quick button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.groups{display:grid;gap:12px}
.group h3{font-size:.8rem;font-family:var(--body);font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px 6px 6px;text-align:left}
.row i{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:block}
.row span{display:grid;min-width:0}
.row b{font-weight:600;font-size:.9rem;line-height:1.2}
.row small{font-family:var(--mono);color:var(--muted);font-size:.76rem}
.row[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.save-form{display:flex;gap:8px;flex-wrap:wrap}
.save-form input{flex:1 1 180px;min-width:0;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:9px 16px;font-size:1rem}
.saves{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.saves li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px}
.saves canvas{width:96px;height:auto;aspect-ratio:1600/941;border-radius:6px;background:var(--line);display:block}
.saves .meta{display:grid;gap:6px;min-width:0}
.saves .meta b{font-family:var(--display);font-weight:500;font-size:1.02rem;overflow-wrap:anywhere}
.saves .meta div{display:flex;gap:6px;flex-wrap:wrap}
.empty{color:var(--muted);margin:0;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1}
.loading{color:var(--muted);text-align:center;padding:40px 0}
</style>
</head>
<body>

<div class="app">
  <section class="stage" aria-label="Desk preview">
    <div class="stage-head">
      <div class="now"><small>Ava's Desk Party</small><strong id="nowName">Design 1</strong></div>
      <button class="btn" id="resetBtn" type="button">Reset</button>
    </div>
    <div class="view">
      <canvas id="desk" width="1600" height="941" aria-label="Painted desk preview"></canvas>
      <canvas id="flash" width="1600" height="941" aria-hidden="true"></canvas>
    </div>
    <p class="hint">Tap any part of the desk to change its color.</p>
  </section>

  <div class="controls">
    <section class="card" aria-labelledby="h-start">
      <div class="card-head"><h2 id="h-start">Start from a design</h2><p>Pick one, then make it yours.</p></div>
      <div class="presets" id="presets"></div>
    </section>

    <section class="card" aria-labelledby="h-top">
      <div class="card-head"><h2 id="h-top">Desk top</h2></div>
      <div class="seg" id="seg-top" role="group" aria-label="Desk top pattern"></div>
      <div class="opts" id="opts-top"></div>
    </section>

    <section class="card" aria-labelledby="h-front">
      <div class="card-head"><h2 id="h-front">Front</h2></div>
      <div class="seg" id="seg-front" role="group" aria-label="Front pattern"></div>
      <div class="opts" id="opts-front"></div>
    </section>

    <section class="card" aria-labelledby="h-colors" id="colorsCard">
      <div class="card-head"><h2 id="h-colors">Colors</h2><p>Tap a part, then tune it.</p></div>
      <div class="editor" id="editor">
        <div class="ed-head">
          <div class="sw-big" id="edSwatch"></div>
          <div><h3 id="edName">Desk top</h3><p class="code" id="edCode"></p></div>
        </div>
        <div class="ed-row">
          <label for="edHex">Color code</label>
          <input class="hex" id="edHex" maxlength="7" spellcheck="false" autocomplete="off" autocapitalize="characters">
          <label class="wheel"><i></i>Color wheel<input type="color" id="edPick" aria-label="Color wheel"></label>
        </div>
        <div class="rgb" id="rgb"></div>
        <div class="quick" id="quick" role="group" aria-label="Quick colors"></div>
        <div class="ed-row" id="edExtra"></div>
      </div>
      <div class="groups" id="groups"></div>
    </section>

    <section class="card" aria-labelledby="h-saved">
      <div class="card-head"><h2 id="h-saved">Saved designs</h2></div>
      <form class="save-form" id="saveForm">
        <input id="saveName" maxlength="40" placeholder="Name this design" aria-label="Design name" autocomplete="off">
        <button class="btn primary" type="submit">Save</button>
      </form>
      <ul class="saves" id="saves"></ul>
      <p class="empty" id="savesEmpty">No saved designs yet. Name your design and tap Save.</p>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- colour helpers ---------- */
function hexOk(v){return /^#?[0-9a-fA-F]{6}$/.test(v.trim())}
function normHex(v){v=v.trim();if(v[0]!=='#')v='#'+v;return v.toUpperCase()}
function rgbOf(h){const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255]}
function hexOf(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v|0)).toString(16).padStart(2,'0')).join('').toUpperCase()}

/* ---------- pattern generation (coverage maps: R = colour 1, G = colour 2) ---------- */
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FILL_A='#ff0000',FILL_B='#00ff00';
function drawStripes(ctx,w,h,p,scale){
  const wd=[20,30,44,62,86][p.size-1]*scale,k=p.useB?3:2;
  const ang={diagR:Math.PI/4,diagL:-Math.PI/4,vert:0,horiz:Math.PI/2}[p.dir]||0;
  const L=Math.hypot(w,h);ctx.save();ctx.translate(w/2,h/2);ctx.rotate(ang);
  const n=Math.ceil(L/wd)+2;
  for(let i=-n;i<=n;i++){const m=((i%k)+k)%k;if(m===0)continue;ctx.fillStyle=m===1?FILL_A:FILL_B;ctx.fillRect(i*wd-0.5,-L,wd+1,2*L)}
  ctx.restore();
}
function drawDots(ctx,w,h,p,scale,valid,gap){
  const R=[9,13,18,24,32][p.size-1]*scale,r2=R*0.6,sp=R*(gap||3.6);
  const rows=Math.ceil(h/(sp*0.866))+2,cols=Math.ceil(w/sp)+2;
  for(let r=-1;r<rows;r++){for(let c=-1;c<cols;c++){
    const big=((r+c)&1)===0,rad=big?R:r2;
    const x=c*sp+(r&1?sp/2:0)+sp*0.35,y=r*sp*0.866+sp*0.4;
    if(!valid(x,y,rad))continue;
    ctx.fillStyle=(p.useB&&!big)?FILL_B:FILL_A;ctx.beginPath();ctx.arc(x,y,rad,0,Math.PI*2);ctx.fill();
  }}
}
function drawSplatter(ctx,w,h,p,scale,areaFactor){
  const rand=rng(p.seed*7919+p.amount*31+p.size);
  const base=[6,9,12,16,21][p.size-1]*scale;
  const count=Math.round([70,120,190,280,400][p.amount-1]*areaFactor);
  ctx.lineCap='round';
  for(let n=0;n<count;n++){
    ctx.fillStyle=ctx.strokeStyle=(p.useB&&rand()>0.62)?FILL_B:FILL_A;
    const x=rand()*w,y=rand()*h,r=base*(0.35+Math.pow(rand(),2)*1.7);
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    const drops=3+Math.floor(rand()*8);
    for(let d=0;d<drops;d++){const a=rand()*Math.PI*2,dist=r*(1.3+rand()*2.6),rr=r*(0.1+rand()*0.3);ctx.beginPath();ctx.arc(x+Math.cos(a)*dist,y+Math.sin(a)*dist,rr,0,Math.PI*2);ctx.fill()}
    if(rand()<0.4){
      const a=rand()*Math.PI*2,len=r*(3+rand()*7),segs=6;let px=x,py=y;
      for(let s=1;s<=segs;s++){const t=s/segs,nx=x+Math.cos(a)*len*t,ny=y+Math.sin(a)*len*t;ctx.lineWidth=Math.max(1,r*0.55*(1-t*0.75));ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(nx,ny);ctx.stroke();px=nx;py=ny}
      if(rand()<0.6){ctx.beginPath();ctx.arc(px,py,r*0.3,0,Math.PI*2);ctx.fill()}
    }
  }
}
function frontAllowed(p){const a=new Uint8Array(18);for(let i=8;i<=12;i++)a[i]=1;if(p.area==='all'){a[4]=1;a[6]=1}return a}
function covFromCanvas(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data,n=cv.width*cv.height,a=new Uint8Array(n),b=new Uint8Array(n);for(let i=0,j=0;i<n;i++,j+=4){a[i]=d[j];b[i]=d[j+1]}return {a,b}}
const covCache=new Map();
function cacheGet(key,make){if(covCache.has(key)){const v=covCache.get(key);covCache.delete(key);covCache.set(key,v);return v}const v=make();covCache.set(key,v);while(covCache.size>6)covCache.delete(covCache.keys().next().value);return v}
function topCov(p){
  const key='top|'+[p.pattern,p.size,p.dir,p.amount,p.seed,p.useB].join(',');
  return cacheGet(key,()=>{
    const cv=document.createElement('canvas');cv.width=FW;cv.height=FD;const ctx=cv.getContext('2d');
    ctx.fillStyle='#000';ctx.fillRect(0,0,FW,FD);
    if(p.pattern==='stripes')drawStripes(ctx,FW,FD,p,1);
    else if(p.pattern==='dots')drawDots(ctx,FW,FD,p,1,(x,y,r)=>x-r>8&&y-r>8&&x+r<FW-8&&y+r<FD-8);
    else if(p.pattern==='splatter')drawSplatter(ctx,FW,FD,p,1,1);
    return covFromCanvas(cv);
  });
}
function frontCov(p){
  const key='front|'+[p.pattern,p.size,p.dir,p.amount,p.seed,p.useB,p.area].join(',');
  return cacheGet(key,()=>{
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
    ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
    const allow=frontAllowed(p);
    if(p.pattern==='stripes')drawStripes(ctx,W,H,p,0.6);
    else if(p.pattern==='dots')drawDots(ctx,W,H,p,0.7,(x,y,r)=>{
      const cx=x|0,cy=y|0;if(cx<0||cy<0||cx>=W||cy>=H)return false;const pc=PART[cy*W+cx];if(!allow[pc])return false;
      for(let t=0;t<12;t++){const a=t*Math.PI/6,sx=Math.round(x+Math.cos(a)*(r+4)),sy=Math.round(y+Math.sin(a)*(r+4));if(sx<0||sy<0||sx>=W||sy>=H)return false;if(PART[sy*W+sx]!==pc)return false}
      return true},4.6);
    else if(p.pattern==='splatter')drawSplatter(ctx,W,H,p,0.75,(p.area==='all'?3.2:2.6));
    return covFromCanvas(cv);
  });
}

/* ---------- renderer: colour × light + shadow, per pixel ---------- */
function renderInto(out,st,stride,ow,oh){
  const col=new Float32Array(18*3);
  for(const o of KEYS){if(o.part){const c=rgbOf(st.colors[o.k]);col[o.part*3]=c[0];col[o.part*3+1]=c[1];col[o.part*3+2]=c[2]}}
  const tOn=st.top.pattern!=='flat',fOn=st.front.pattern!=='flat';
  const tc=tOn?topCov(st.top):null,fc=fOn?frontCov(st.front):null;
  const tA=rgbOf(st.colors.topA),tB=rgbOf(st.colors.topB),fA=rgbOf(st.colors.frontA),fB=rgbOf(st.colors.frontB);
  const fset=frontAllowed(st.front);
  const inv=1/255;let q=0;
  for(let ty=0;ty<oh;ty++){
    const row=ty*stride*W;
    for(let tx=0;tx<ow;tx++){
      const i=row+tx*stride,p=PART[i],s=S[i],o=O[i];
      if(p<2){if(p===0){out[q]=o+2;out[q+1]=o+1;out[q+2]=o-3}else{out[q]=out[q+1]=out[q+2]=o}}
      else{
        let r=col[p*3],g=col[p*3+1],b=col[p*3+2];
        if(p===2&&tOn){const j=TOPMAP[i];if(j>=0){const a=tc.a[j]*inv,bb=tc.b[j]*inv;let k=1-a-bb;if(k<0)k=0;r=r*k+tA[0]*a+tB[0]*bb;g=g*k+tA[1]*a+tB[1]*bb;b=b*k+tA[2]*a+tB[2]*bb}}
        else if(fOn&&fset[p]){const a=fc.a[i]*inv,bb=fc.b[i]*inv;if(a+bb>0){let k=1-a-bb;if(k<0)k=0;r=r*k+fA[0]*a+fB[0]*bb;g=g*k+fA[1]*a+fB[1]*bb;b=b*k+fA[2]*a+fB[2]*bb}}
        out[q]=r*s+o;out[q+1]=g*s+o;out[q+2]=b*s+o;
      }
      out[q+3]=255;q+=4;
    }
  }
}
let raf=0;
function render(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;renderInto(deskImg.data,state,1,W,H);deskCtx.putImageData(deskImg,0,0)})}
function thumb(cv,st){
  const sd=4,ow=Math.floor(W/sd),oh=Math.floor(H/sd);cv.width=ow;cv.height=oh;
  const ctx=cv.getContext('2d'),im=ctx.createImageData(ow,oh);renderInto(im.data,st,sd,ow,oh);ctx.putImageData(im,0,0);
}

/* ---------- picking a part on the preview ---------- */
function keyAt(i){
  const p=PART[i];if(p<2)return null;
  if(p===2&&state.top.pattern!=='flat'){const j=TOPMAP[i];if(j>=0){const c=topCov(state.top);if(c.a[j]>127)return 'topA';if(c.b[j]>127)return 'topB'}}
  if(state.front.pattern!=='flat'&&frontAllowed(state.front)[p]){const c=frontCov(state.front);if(c.a[i]>127)return 'frontA';if(c.b[i]>127)return 'frontB'}
  return PARTKEY[p];
}
function flash(key){
  const im=flashCtx.createImageData(W,H),d=im.data,o=KEYMAP[key];
  let test;
  if(o.part){const P=o.part;
    if(P===2&&state.top.pattern!=='flat'){const c=topCov(state.top);test=i=>PART[i]===2&&TOPMAP[i]>=0&&c.a[TOPMAP[i]]<=127&&c.b[TOPMAP[i]]<=127}
    else if(state.front.pattern!=='flat'&&frontAllowed(state.front)[P]){const c=frontCov(state.front);test=i=>PART[i]===P&&c.a[i]<=127&&c.b[i]<=127}
    else test=i=>PART[i]===P;}
  else if(o.pat==='top'){if(state.top.pattern==='flat')return;const c=topCov(state.top),ch=o.slot==='A'?c.a:c.b;test=i=>PART[i]===2&&TOPMAP[i]>=0&&ch[TOPMAP[i]]>127}
  else{if(state.front.pattern==='flat')return;const c=frontCov(state.front),ch=o.slot==='A'?c.a:c.b,al=frontAllowed(state.front);test=i=>al[PART[i]]&&ch[i]>127}
  for(let i=0,j=0;i<N;i++,j+=4){if(test(i)){d[j]=44;d[j+1]=102;d[j+2]=214;d[j+3]=150}}
  flashCtx.putImageData(im,0,0);flashCv.classList.remove('on');void flashCv.offsetWidth;flashCv.classList.add('on');
}
deskCv.addEventListener('click',e=>{
  const r=deskCv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*W),y=Math.floor((e.clientY-r.top)/r.height*H);
  if(x<0||y<0||x>=W||y>=H)return;const k=keyAt(y*W+x);if(!k)return;select(k,true);flash(k);
});

const PAT_NAMES={flat:'Flat',dots:'Polka dots',stripes:'Stripes',splatter:'Splatter'};
function buildSeg(region){
  const el=document.getElementById('seg-'+region);
  Object.keys(PAT_NAMES).forEach(p=>{
    const b=document.createElement('button');b.type='button';b.id=region+'-pat-'+p;b.dataset.p=p;b.innerHTML=ICONS[p]+'<span>'+PAT_NAMES[p]+'</span>';
    b.addEventListener('click',()=>{state[region].pattern=p;changed();syncPatternUI(region)});el.appendChild(b);
  });
}
function chipRow(label,id,items,cur,onPick){
  const wrap=document.createElement('div');wrap.className='opt';
  wrap.innerHTML='<span></span><div class="chips" role="group"></div>';wrap.firstChild.textContent=label;
  const ch=wrap.querySelector('.chips');ch.setAttribute('aria-label',label);
  items.forEach(([v,t])=>{const b=document.createElement('button');b.type='button';b.id=id+'-'+v;b.textContent=t;b.setAttribute('aria-pressed',String(v===cur));b.addEventListener('click',()=>{onPick(v);ch.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});ch.appendChild(b)});
  return wrap;
}
function sliderRow(label,id,val,onInput){
  const wrap=document.createElement('div');wrap.className='opt';
  wrap.innerHTML='<label></label><input type="range" min="1" max="5" step="1">';
  const l=wrap.querySelector('label'),r=wrap.querySelector('input');l.textContent=label;l.htmlFor=id;r.id=id;r.value=val;
  r.addEventListener('input',()=>onInput(+r.value));return wrap;
}
function syncPatternUI(region){
  const p=state[region];
  document.querySelectorAll('#seg-'+region+' button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===p.pattern)));
  const box=document.getElementById('opts-'+region);box.innerHTML='';
  if(p.pattern!=='flat'){
    const sizeLabel={dots:'Dot size',stripes:'Stripe width',splatter:'Splat size'}[p.pattern];
    box.appendChild(sliderRow(sizeLabel,region+'-size',p.size,v=>{p.size=v;changed()}));
    if(p.pattern==='stripes')box.appendChild(chipRow('Direction',region+'-dir',[['diagR','Slant /'],['diagL','Slant \\'],['vert','Up and down'],['horiz','Side to side']],p.dir,v=>{p.dir=v;changed()}));
    if(p.pattern==='splatter'){
      box.appendChild(sliderRow('How much',region+'-amount',p.amount,v=>{p.amount=v;changed()}));
      const w=document.createElement('div');w.className='opt';w.innerHTML='<span>Mix it up</span><div><button type="button" class="btn small">New splatter</button></div>';
      const nb=w.querySelector('button');nb.id=region+'-reroll';nb.addEventListener('click',()=>{p.seed=(p.seed*16807+13)%99991;changed()});box.appendChild(w);
    }
    box.appendChild(chipRow('Colors',region+'-useb',[['1','1 color'],['2','2 colors']],p.useB?'2':'1',v=>{p.useB=v==='2';changed();buildGroups()}));
    if(region==='front')box.appendChild(chipRow('Pattern on',region+'-area',[['drawers','Drawers only'],['all','Drawers, body and trim']],p.area,v=>{p.area=v;changed()}));
  }
  buildGroups();
}

function setColor(key,hex,from){
  state.colors[key]=hex.toUpperCase();

function syncEditor(from){
  const o=KEYMAP[selected],hx=state.colors[selected],c=rgbOf(hx);
  document.getElementById('edName').textContent=o.name;
  document.getElementById('edSwatch').style.background=hx;
  document.getElementById('edCode').textContent=hx+'  ·  RGB '+c.join(', ');

  chans.forEach((ch,i)=>{
    if(from!=='rgb'||document.activeElement!==ch.n)ch.n.value=c[i];
    ch.r.value=c[i];
    const lo=c.slice(),hi=c.slice();lo[i]=0;hi[i]=255;ch.r.style.setProperty('--track','linear-gradient(90deg,'+hexOf(...lo)+','+hexOf(...hi)+')');
  });
  quickEl.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.hex===hx)));
  const ex=document.getElementById('edExtra');ex.innerHTML='';
  const addCopy=(list,label)=>{const b=document.createElement('button');b.type='button';b.className='btn small';b.id='copy-to-'+label.replace(/\W+/g,'-');b.textContent='Use this color on '+label;b.addEventListener('click',()=>{list.forEach(k=>state.colors[k]=state.colors[selected]);buildGroups();changed();toast('Done')});ex.appendChild(b)};
  if(DRAWERS.includes(selected))addCopy(DRAWERS,'all drawers');

function select(key,fromPreview){
  selected=key;syncEditor();
  document.querySelectorAll('.row').forEach(r=>r.setAttribute('aria-pressed',String(r.dataset.k===key)));
  if(fromPreview){const ed=document.getElementById('editor'),rc=ed.getBoundingClientRect(),stage=document.querySelector('.stage').getBoundingClientRect();
    const narrow=matchMedia('(max-width:900px)').matches,topLimit=narrow?stage.bottom:0;
    if(rc.top<topLimit||rc.bottom>innerHeight)window.scrollBy({top:rc.top-topLimit-12,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}
}
const groupsEl=document.getElementById('groups');
function visibleKeys(){return KEYS.filter(o=>{if(!o.pat)return true;const p=state[o.pat];if(p.pattern==='flat')return false;if(o.slot==='B'&&!p.useB)return false;return true})}
function buildGroups(){
  const vis=visibleKeys();if(!vis.find(o=>o.k===selected)){selected='top'}
  groupsEl.innerHTML='';const groups={};
  vis.forEach(o=>{if(!groups[o.group]){const g=document.createElement('div');g.className='group';g.innerHTML='<h3></h3><div class="rows"></div>';g.querySelector('h3').textContent=o.group;groupsEl.appendChild(g);groups[o.group]=g.querySelector('.rows')}
    const b=document.createElement('button');b.type='button';b.className='row';b.dataset.k=o.k;b.id='row-'+o.k;b.setAttribute('aria-pressed',String(o.k===selected));
    b.innerHTML='<i></i><span><b></b><small></small></span>';b.querySelector('b').textContent=o.name;
    b.addEventListener('click',()=>{select(o.k);flash(o.k)});groups[o.group].appendChild(b);updateRow(o.k);
  });
  syncEditor();
}
function updateRow(k){const r=document.getElementById('row-'+k);if(!r)return;const hx=state.colors[k],c=rgbOf(hx);r.querySelector('i').style.background=hx;r.querySelector('small').textContent=hx+' · '+c.join(',')}

/* ---------- state, reset, saving ---------- */
function sameAsOrigin(){return origin&&JSON.stringify(state)===JSON.stringify(origin.st)}
function updateNow(){
  const el=document.getElementById('nowName');el.textContent=origin.name;
  if(!sameAsOrigin()){const e=document.createElement('em');e.textContent='  (changed)';el.appendChild(e)}
  document.getElementById('resetBtn').textContent='Reset to '+(origin.type==='preset'?origin.name.split(' · ')[0]:'"'+origin.name+'"');
  Object.entries(presetBtns).forEach(([id,b])=>b.setAttribute('aria-pressed',String(origin.type==='preset'&&origin.id===id)));
}
let saveT=0;
function changed(){render();updateNow();clearTimeout(saveT);saveT=setTimeout(()=>LS.set(KEY_CUR,{state,origin}),400)}
function loadState(st,org){
  state=clone(st);origin=Object.assign({},org,{st:clone(st)});
  syncPatternUI('top');syncPatternUI('front');changed();
}
document.getElementById('resetBtn').addEventListener('click',()=>{loadState(origin.st,origin);toast('Back to '+(origin.type==='preset'?origin.name.split(' · ')[0]:origin.name))});

let saves=LS.get(KEY_SAVES)||[];
const storageOk=LS.set('avaDeskTuner.test',1);
function persistSaves(){if(!LS.set(KEY_SAVES,saves))toast('This browser is blocking saving')}
const savesEl=document.getElementById('saves');
function renderSaves(){
  savesEl.innerHTML='';
  document.getElementById('savesEmpty').hidden=saves.length>0;
  if(!storageOk)document.getElementById('savesEmpty').textContent='Saving is turned off in this browser, so designs will not be kept after it closes.';
  saves.slice().sort((a,b)=>b.t-a.t).forEach(sv=>{
    const li=document.createElement('li');
    li.innerHTML='<canvas></canvas><div class="meta"><b></b><div><button type="button" class="btn small primary">Open</button><button type="button" class="btn small">Delete</button></div></div>';
    li.querySelector('b').textContent=sv.name;
    const [openB,delB]=li.querySelectorAll('button');openB.id='open-'+sv.id;delB.id='del-'+sv.id;
    openB.addEventListener('click',()=>{loadState(sv.st,{type:'save',id:sv.id,name:sv.name});toast('Opened "'+sv.name+'"')});
    delB.addEventListener('click',()=>{
      if(delB.dataset.armed){saves=saves.filter(x=>x.id!==sv.id);persistSaves();renderSaves();toast('Deleted "'+sv.name+'"')}
      else{delB.dataset.armed='1';delB.textContent='Tap again to delete';delB.classList.add('danger');setTimeout(()=>{if(delB.isConnected){delete delB.dataset.armed;delB.textContent='Delete';delB.classList.remove('danger')}},3500)}
    });
    savesEl.appendChild(li);
    setTimeout(()=>thumb(li.querySelector('canvas'),sv.st),0);
  });
}
document.getElementById('saveForm').addEventListener('submit',e=>{
  e.preventDefault();const inp=document.getElementById('saveName');const name=inp.value.trim();
  if(!name){inp.focus();toast('Type a name first');return}
  const ex=saves.find(s=>s.name.toLowerCase()===name.toLowerCase());
  let id;
  if(ex){ex.st=clone(state);ex.t=Date.now();id=ex.id;toast('Updated "'+name+'"')}
  else{id='s'+Date.now().toString(36);saves.push({id,name,t:Date.now(),st:clone(state)});toast('Saved "'+name+'"')}
  persistSaves();origin={type:'save',id,name,st:clone(state)};inp.value='';renderSaves();changed();
});

let toastT=0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------- boot: unpack the desk map ---------- */
const img=new Image();
img.onload=()=>{
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');ctx.drawImage(img,0,0);
  const d=ctx.getImageData(0,0,W,H).data;
  S=new Float32Array(N);O=new Float32Array(N);PART=new Uint8Array(N);TOPMAP=new Int32Array(N).fill(-1);
  const h=DATA.H;
  for(let i=0,j=0;i<N;i++,j+=4){
    S[i]=d[j]/230;O[i]=d[j+1]*1.2-48;const p=d[j+2];PART[i]=p;
    if(p===2){const x=i%W+0.5,y=(i/W|0)+0.5,z=h[6]*x+h[7]*y+h[8];let u=(h[0]*x+h[1]*y+h[2])/z,v=(h[3]*x+h[4]*y+h[5])/z;u=Math.max(0,Math.min(FW-1,u|0));v=Math.max(0,Math.min(FD-1,v|0));TOPMAP[i]=v*FW+u}
  }
  deskImg=deskCtx.createImageData(W,H);
  buildSeg('top');buildSeg('front');
  const cur=LS.get(KEY_CUR);
  if(cur&&cur.state&&cur.origin&&cur.state.colors){state=cur.state;origin=cur.origin;
    // keep shape current if new colour keys were added later
    state.colors=Object.assign(colors(),state.colors);state.top=pat(state.top);state.front=pat(state.front);
    syncPatternUI('top');syncPatternUI('front');changed()}
  else loadState(PRESETS[0].st,{type:'preset',id:'p1',name:PRESETS[0].name});
  renderSaves();
  let k=0;(function next(){if(k>=PRESETS.length)return;thumb(presetBtns[PRESETS[k].id].querySelector('canvas'),PRESETS[k].st);k++;setTimeout(next,30)})();
};
img.src='data:image/png;base64,'+DATA.png;
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&document.querySelector('link[rel=manifest]')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
})();
</script>
